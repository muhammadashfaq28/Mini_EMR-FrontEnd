<mat-card class="prescription-card">

    <form [formGroup]="prescriptionForm">

        <div class="section-header">

            <div class="section-title">
                Prescriptions
            </div>

            <button
                mat-raised-button
                color="primary"
                type="button"
                (click)="addPrescription()">

                + Add Medicine

            </button>

        </div>

        <div formArrayName="prescriptions">

            @for (
                prescription of prescriptions.controls;
                track $index
            ) {
                <div
                    class="prescription-row"
                    [formGroupName]="$index">

                    <mat-form-field appearance="outline">

                        <mat-label>
                            Medicine
                        </mat-label>

                        <mat-select formControlName="medicineId">

                            @for (
                                medicine of medicines();
                                track medicine.id
                            ) {
                                <mat-option [value]="medicine.id">
                                    {{ medicine.name }} - {{ medicine.strength }}
                                </mat-option>
                            }

                        </mat-select>

                    </mat-form-field>

                    <mat-form-field appearance="outline">

                        <mat-label>
                            Dosage
                        </mat-label>

                        <input
                            matInput
                            placeholder="500mg"
                            formControlName="dosage">

                    </mat-form-field>

                    <mat-form-field appearance="outline">

                        <mat-label>
                            Frequency
                        </mat-label>

                        <mat-select formControlName="frequency">

                            <mat-option value="Once daily">
                                Once daily
                            </mat-option>

                            <mat-option value="Twice daily">
                                Twice daily
                            </mat-option>

                            <mat-option value="Thrice daily">
                                Thrice daily
                            </mat-option>

                            <mat-option value="Four times daily">
                                Four times daily
                            </mat-option>

                            <mat-option value="As needed">
                                As needed
                            </mat-option>

                        </mat-select>

                    </mat-form-field>

                    <mat-form-field appearance="outline">

                        <mat-label>
                            Duration (Days)
                        </mat-label>

                        <input
                            matInput
                            type="number"
                            formControlName="durationDays">

                    </mat-form-field>

                    <mat-form-field
                        appearance="outline"
                        class="full-width">

                        <mat-label>
                            Instructions
                        </mat-label>

                        <input
                            matInput
                            formControlName="instructions">

                    </mat-form-field>

                    <button
                        mat-icon-button
                        color="warn"
                        type="button"
                        class="remove-btn"
                        (click)="removePrescription($index)">

                        <mat-icon>
                            close
                        </mat-icon>

                    </button>

                </div>
            }

        </div>

    </form>

</mat-card>
